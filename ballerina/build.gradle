import org.apache.tools.ant.taskdefs.condition.Os
import org.gradle.process.ExecOperations

import javax.inject.Inject

abstract class BallerinaExecHelper {
    @Inject abstract ExecOperations getExecOperations()
}

plugins{
    id 'io.ballerina.plugin'
}

description = 'Azure Model Provider - Ballerina'

def packageName = "ai.azure"
def packageOrg = "ballerinax"
def tomlVersion = stripBallerinaExtensionVersion("${project.version}")
def ballerinaTomlFilePlaceHolder = new File("${project.rootDir}/build-config/resources/Ballerina.toml")
def compilerPluginTomlFilePlaceHolder = new File("${project.rootDir}/build-config/resources/CompilerPlugin.toml")
def ballerinaTomlFile = new File("$project.projectDir/Ballerina.toml")
def compilerPluginTomlFile = new File("$project.projectDir/CompilerPlugin.toml")

def stripBallerinaExtensionVersion(String extVersion) {
    if (extVersion.matches(project.ext.timestampedVersionRegex)) {
        def splitVersion = extVersion.split('-')
        if (splitVersion.length > 3) {
            def strippedValues = splitVersion[0..-4]
            return strippedValues.join('-')
        } else {
            return extVersion
        }
    } else {
        return extVersion.replace("${project.ext.snapshotVersion}", "")
    }
}

ballerina {
    packageOrganization = packageOrg
    module = packageName
    testCoverageParam = "--code-coverage --coverage-format=xml"
    connector = true
    platform = "java25"
}

// The managed-identity mock tests need IDENTITY_ENDPOINT and IDENTITY_HEADER in the real process environment (MSAL
// reads them directly), so the regular test run leaves their group out; `testManagedIdentityMock` runs it instead.
def managedIdentityMockGroup = "managed-identity-mock"
def groupsProperty = { String name ->
    project.hasProperty(name) ? project.property(name).toString().split(",").collect { it.trim() } : null
}
def selectedGroups = groupsProperty("groups")
def disabledGroups = groupsProperty("disable")
// `testManagedIdentityMock` follows `test` unless -Pgroups leaves the group out or -Pdisable names it.
def runManagedIdentityMock = (selectedGroups == null || selectedGroups.contains(managedIdentityMockGroup)) &&
        !(disabledGroups != null && disabledGroups.contains(managedIdentityMockGroup))
if (selectedGroups == null && disabledGroups == null) {
    ext.disable = managedIdentityMockGroup
}

task testManagedIdentityMock {
    description = "Runs the managed-identity mock tests over HTTP and HTTPS, each in its own bal test process."
    group = "verification"
    dependsOn ":ai.azure-native:build"
    dependsOn ":ai.azure-compiler-plugin:build"
    def execHelper = project.objects.newInstance(BallerinaExecHelper)
    def rootDirectory = project.rootDir
    def envFile = layout.buildDirectory.file("managed-identity-mock.env").get().asFile
    def distribution = (ballerinaTomlFile.text =~ /distribution\s*=\s*"([^"]+)"/)[0][1]
    doLast {
        ["http://localhost:8093/msi/token", "https://localhost:8094/msi/token"].each { endpoint ->
            envFile.parentFile.mkdirs()
            // A throwaway value per run; it is a test secret, so it goes through a file rather than the command line.
            envFile.text = "IDENTITY_ENDPOINT=${endpoint}\nIDENTITY_HEADER=test-${UUID.randomUUID()}\n"
            def output = new ByteArrayOutputStream()
            def result
            try {
                result = execHelper.execOperations.exec {
                    ignoreExitValue true
                    standardOutput = output
                    errorOutput = output
                    commandLine "docker", "run", "--rm", "--net=host", "-u", "root", "--env-file", envFile.path,
                            "-v", "${rootDirectory}:/home/ballerina/${rootDirectory.name}",
                            "ballerina/ballerina:${distribution}", "/bin/sh", "-c",
                            "cd ${rootDirectory.name}/ballerina && bal test --groups ${managedIdentityMockGroup}"
                }
            } finally {
                envFile.delete()
            }
            def log = output.toString()
            println "===== ${managedIdentityMockGroup} (${endpoint.startsWith("https") ? "HTTPS" : "HTTP"})"
            println log
            if (result.exitValue != 0) {
                throw new GradleException("${managedIdentityMockGroup} tests failed against ${endpoint}")
            }
            ["No SLF4J providers", "NoClassDefFoundError"].each { marker ->
                if (log.contains(marker)) {
                    throw new GradleException("'${marker}' in the ${managedIdentityMockGroup} output for ${endpoint}")
                }
            }
            def passing = (log =~ /(\d+) passing/).collect { it[1] as int }.sum() ?: 0
            if (passing < 7) {
                throw new GradleException("expected the ${managedIdentityMockGroup} tests to run against ${endpoint}, " +
                        "but only ${passing} passed")
            }
        }
    }
}

task updateTomlFiles {
    doLast {
        def newBallerinaToml = ballerinaTomlFilePlaceHolder.text.replace("@project.version@", project.version)
        newBallerinaToml = newBallerinaToml.replace("@toml.version@", tomlVersion)
                .replace("@azure.identity.version@", project.azureIdentityVersion)
                .replace("@azure.core.version@", project.azureCoreVersion)
                .replace("@azure.core.http.jdk.httpclient.version@", project.azureCoreHttpJdkHttpClientVersion)
                .replace("@azure.json.version@", project.azureJsonVersion)
                .replace("@azure.xml.version@", project.azureXmlVersion)
                .replace("@msal4j.version@", project.msal4jVersion)
                .replace("@msal4j.persistence.extension.version@", project.msal4jPersistenceExtensionVersion)
                .replace("@jna.version@", project.jnaVersion)
                .replace("@jna.platform.version@", project.jnaPlatformVersion)
                .replace("@jackson.version@", project.jacksonVersion)
                .replace("@reactor.core.version@", project.reactorCoreVersion)
                .replace("@reactive.streams.version@", project.reactiveStreamsVersion)
        ballerinaTomlFile.text = newBallerinaToml

        def ballerinaToOpenApiVersion = project.ballerinaToOpenApiVersion
        def newCompilerPluginToml = compilerPluginTomlFilePlaceHolder.text.replace("@project.version@", project.version)
        newCompilerPluginToml = newCompilerPluginToml.replace("@ballerinaToOpenApiVersion.version@", ballerinaToOpenApiVersion)
        compilerPluginTomlFile.text = newCompilerPluginToml
    }
}

task commitTomlFiles {
    def execHelper = project.objects.newInstance(BallerinaExecHelper)
    doLast {
        execHelper.execOperations.exec {
            ignoreExitValue true
            if (Os.isFamily(Os.FAMILY_WINDOWS)) {
                commandLine 'cmd', '/c', "git commit -m \"[Automated] Update the toml files\" Ballerina.toml Dependencies.toml CompilerPlugin.toml"
            } else {
                commandLine 'sh', '-c', "git commit -m '[Automated] Update the toml files' Ballerina.toml Dependencies.toml CompilerPlugin.toml"
            }
        }
    }
}

publishing {
    publications {
        maven(MavenPublication) {
            artifact source: createArtifactZip, extension: 'zip'
        }
    }
    repositories {
        maven {
            name = "GitHubPackages"
            url = uri("https://maven.pkg.github.com/ballerina-platform/module-${packageOrg}-${packageName}")
            credentials {
                username = System.getenv("publishUser")
                password = System.getenv("publishPAT")
            }
        }
    }
}

clean {
    delete 'build'
}

build.dependsOn ':ai.azure-native:build'
test.dependsOn ':ai.azure-native:build'
// Runs with every `test` (and so every `build`), but not when tests are skipped with `-x test` or the group is
// filtered out with -Pgroups or -Pdisable.
if (runManagedIdentityMock) {
    test.finalizedBy testManagedIdentityMock
}
build.dependsOn ":ai.azure-compiler-plugin:build"
build.dependsOn "generatePomFileForMavenPublication"
publishToMavenLocal.dependsOn build
publish.dependsOn build
