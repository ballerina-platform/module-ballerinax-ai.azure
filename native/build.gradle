plugins {
    id 'java'
    id 'com.github.spotbugs'
    id 'checkstyle'
}

description = 'Ballerina - Azure OpenAI package Java Utils'

dependencies {
    implementation group: 'org.ballerinalang', name: 'ballerina-lang', version: "${ballerinaLangVersion}"
    implementation group: 'org.ballerinalang', name: 'ballerina-runtime', version: "${ballerinaLangVersion}"
    implementation(group: 'com.azure', name: 'azure-identity', version: "${azureIdentityVersion}") {
        // Token requests go through the JDK HTTP client below; Netty would clash with ballerina/http's.
        exclude group: 'com.azure', module: 'azure-core-http-netty'
    }
    implementation group: 'com.azure', name: 'azure-core-http-jdk-httpclient', version: "${azureCoreHttpJdkHttpClientVersion}"
    checkstyle project(":checkstyle")
    checkstyle "com.puppycrawl.tools:checkstyle:${checkstylePluginVersion}"
}

spotbugsMain {
    def classLoader = plugins["com.github.spotbugs"].class.classLoader
    def SpotBugsConfidence = classLoader.findLoadedClass("com.github.spotbugs.snom.Confidence")
    def SpotBugsEffort = classLoader.findLoadedClass("com.github.spotbugs.snom.Effort")
    ignoreFailures = true
    effort = SpotBugsEffort.MAX
    reportLevel = SpotBugsConfidence.LOW
    reportsDir = layout.buildDirectory.dir("reports/spotbugs")
    def excludeFile = file("${rootDir}/build-config/spotbugs-exclude.xml")
    if (excludeFile.exists()) {
        it.excludeFilter = excludeFile
    }
    reports {
        text.enabled = true
    }
}

task validateSpotbugs() {
    doLast {
        if (spotbugsMain.reports.size() > 0 &&
                spotbugsMain.reports[0].destination.exists() &&
                spotbugsMain.reports[0].destination.text.readLines().size() > 0) {
            spotbugsMain.reports[0].destination?.eachLine {
                println 'Failure: ' + it
            }
            throw new GradleException("Spotbugs rule violations were found.");
        }
    }
}

checkstyle {
    toolVersion '7.8.2'
    configFile file("${rootDir}/build-config/checkstyle/build/checkstyle.xml")
    configProperties = ["suppressionFile": file("${rootDir}/build-config/checkstyle/build/suppressions.xml")]
}

tasks.withType(Checkstyle) {
    exclude '**/module-info.java'
    exclude '**/FoundryBuildInfo.java'
}

// Strips the snapshot or timestamp suffix from a version. Same rule (and the same root `ext` values) as
// stripBallerinaExtensionVersion in ballerina/build.gradle, which writes the Ballerina.toml package version.
def stripFoundryBuildVersion(String version) {
    if (version.matches(project.ext.timestampedVersionRegex)) {
        def splitVersion = version.split('-')
        return splitVersion.length > 3 ? splitVersion[0..-4].join('-') : version
    }
    return version.replace("${project.ext.snapshotVersion}", "")
}

// Generates FoundryBuildInfo.java with the package version (exactly as Ballerina.toml carries it) and the
// Ballerina distribution this build uses, so the Foundry `x-platform-server` header never carries a
// hand-maintained version that can drift.
def foundryBuildInfoDir = layout.buildDirectory.dir("generated/sources/foundryBuildInfo/java")
def generateFoundryBuildInfo = tasks.register('generateFoundryBuildInfo') {
    def packageVersion = stripFoundryBuildVersion(project.version.toString())
    def ballerinaVersion = stripFoundryBuildVersion(project.ballerinaLangVersion.toString())
    def outputDir = foundryBuildInfoDir
    inputs.property('packageVersion', packageVersion)
    inputs.property('ballerinaVersion', ballerinaVersion)
    outputs.dir(outputDir)
    doLast {
        def file = outputDir.get().file("io/ballerina/lib/ai/azure/FoundryBuildInfo.java").asFile
        file.parentFile.mkdirs()
        file.text = """package io.ballerina.lib.ai.azure;

/**
 * Build-time values for the Foundry listener. Generated by the native Gradle build; do not edit.
 */
final class FoundryBuildInfo {
    static final String PACKAGE_VERSION = "${packageVersion}";
    static final String BALLERINA_VERSION = "${ballerinaVersion}";

    private FoundryBuildInfo() {
    }
}
"""
    }
}
sourceSets.main.java.srcDir(generateFoundryBuildInfo)

spotbugsMain.finalizedBy validateSpotbugs
checkstyleMain.dependsOn(":checkstyle:downloadCheckstyleRuleFiles")

compileJava {
    doFirst {
        options.compilerArgs = [
                '--module-path', classpath.asPath,
        ]
        classpath = files()
    }
}
