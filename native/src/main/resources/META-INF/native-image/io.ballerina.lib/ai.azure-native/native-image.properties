# Same approach as ballerinax/azure.storage.blob, which ships the same azure-identity and Jackson jars.
# azure-core initializes com.azure.core.util.Configuration at build time, and its logger lookup binds through
# SLF4J 2 (bundled with the Ballerina runtime) to the JUL adapter; the binding leaves SLF4J's provider and factory
# objects in the image heap, so the org.slf4j package is initialized at build time as a whole (the http module
# does the same). azure-core also builds Jackson's Base64Variants table in, but not the variant class of the
# objects it holds, so those classes are initialized at build time too.
# azure-core-http-jdk-httpclient's JdkHttpClientBuilder reads System.getProperty("java.home") into a static field
# and passes it to Paths.get when a client is built; java.home is null in a native image, so building a client
# fails with a NullPointerException. Initialized at build time, the field holds the build JDK's path instead, and
# where that path does not exist the builder's own IOException handling falls back to the default restricted
# headers.
Args = --initialize-at-build-time=org.slf4j,com.fasterxml.jackson.core.Base64Variant,com.fasterxml.jackson.core.Base64Variant$PaddingReadBehaviour,com.fasterxml.jackson.core.Base64Variants,com.azure.core.http.jdk.httpclient.JdkHttpClientBuilder
